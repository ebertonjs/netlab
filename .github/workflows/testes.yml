# Testes a cada push e pull request. Nada deve ir para a main com este workflow vermelho.
# Roda local também:  pip install -r requirements-dev.txt && pytest -q
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS bookworm (o Pi); 3.13 = versão mais nova
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependências
        run: pip install -r requirements-dev.txt

      - name: Compila todos os .py
        run: python -m compileall -q netnoc main.py manage.py

      - name: Cenários (MikroTik, DVR e Telegram simulados)
        run: pytest -q

  navegador:
    name: Interface no navegador (todas as telas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependências + Chromium
        run: |
          pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Abre todas as telas e falha em qualquer erro de JavaScript
        run: pytest -q tests/test_navegador.py

  interface:
    name: Interface (sintaxe JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check em todos os .js
        run: |
          falhou=0
          while IFS= read -r f; do node --check "$f" || falhou=1; done < <(find static -name '*.js')
          exit $falhou

  coletor:
    name: Coletor Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: collector
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
